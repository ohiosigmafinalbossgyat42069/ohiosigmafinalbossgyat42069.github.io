<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valence Chemistry Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🧪 Valence Quiz</h1>
    
    <!-- Bước 1: Thiết lập số lượng câu hỏi -->
    <div id="step-setup" class="step active">
        <p>Up to how many elements do you wish to memorize?</p>
        <input type="number" id="element-count" min="1" max="118" value="10">
        <br>
        <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- Bước 2: Khu vực làm bài Quiz -->
    <div id="step-quiz" class="step">
        <div id="question-text"></div>
        <div id="clue-container"></div>
        <input type="text" id="answer-input" placeholder="e.g. II IV (separated by space)">
        <br>
        <button id="submit-btn" onclick="handleSubmission()">Submit</button>
        <div id="feedback-msg" class="output-msg"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
